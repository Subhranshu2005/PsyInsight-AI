[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psyinsight-ai"
version = "0.2.0"
description = "An AI-powered Psychology Research Assistant using Data Science, Machine Learning, Deep Learning, Statistics, Probability, Automata Theory, and Transformers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Subhranshu Ranjan Sahoo" }
]
keywords = ["psychology", "research", "data-science", "machine-learning", "nlp", "statistics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "matplotlib>=3.7",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dl = ["torch>=2.1"]
nlp = ["transformers>=4.35", "torch>=2.1"]
xai = ["shap>=0.44"]
app = ["streamlit>=1.30", "openpyxl>=3.1"]
dev = ["pytest>=7.4", "hypothesis>=6.100"]
all = ["psyinsight-ai[dl,nlp,xai,app,dev]"]

[project.urls]
Homepage = "https://github.com/Subhranshu2005/PsyInsight-AI"
Repository = "https://github.com/Subhranshu2005/PsyInsight-AI"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
